[package]
name = "secondlang"
version = "0.1.0"
description = "A typed, compiled programming language with LLVM backend"
edition = "2024"

[lints]
workspace = true

[dependencies]
pest = "2.8.5"
pest_derive = "2.8.5"
anyhow = "1.0.100"
inkwell = { version = "0.7.1", features = ["llvm21-1"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "secondlang"
path = "src/main.rs"
