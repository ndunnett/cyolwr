[package]
name = "calculator"
version = "0.1.0"
description = "A simple calculator language for learning compiler basics"
edition = "2024"

[lints]
workspace = true

[dependencies]
pest = "2.8.5"
pest_derive = "2.8.5"
anyhow = "1.0.100"
rustyline = "17.0.2"
cfg-if = "1.0.4"
home = "0.5.12"
inkwell = { version = "0.7.1", features = ["llvm21-1"], optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"
test = false

[[bin]]
name = "repl"
test = false

[features]
default = ["interpreter"]
jit = ["inkwell"]
interpreter = []
vm = []
